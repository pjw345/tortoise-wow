name: Upstream health and SQL regressions
on:
  push:
    paths: ['src/game/Objects/Creature.cpp', 'src/game/Commands/Commands.cpp', 'tests/upstream-health-sql/**', '.github/workflows/upstream-health-sql.yml']
  pull_request:
    paths: ['src/game/Objects/Creature.cpp', 'src/game/Commands/Commands.cpp', 'tests/upstream-health-sql/**', '.github/workflows/upstream-health-sql.yml']
permissions:
  contents: read
jobs:
  health:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/upstream-health-sql -B build/health-tests
      - run: cmake --build build/health-tests --config Release
      - run: ctest --test-dir build/health-tests -C Release --output-on-failure
  sql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
        options: >-
          --health-cmd="mysqladmin ping -uroot -pci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/upstream-health-sql/test_gm_sql.py
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}

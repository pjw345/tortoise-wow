name: Playerbot spell fallback
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-methods:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/playerbot-spell-fallback -B build/spell-fallback
      - run: cmake --build build/spell-fallback --config Release
      - run: ctest --test-dir build/spell-fallback -C Release --output-on-failure
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - shell: pwsh
        run: ./tools/audit-core-contracts.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: spell-fallback-source-audit
          path: docs/core-audit/

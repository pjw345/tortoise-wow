name: Playerbot recovery and profession commands
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-methods:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S tests/playerbot-recovery-loot -B build/recovery-loot
      - run: cmake --build build/recovery-loot --config Release
      - run: ctest --test-dir build/recovery-loot -C Release --output-on-failure

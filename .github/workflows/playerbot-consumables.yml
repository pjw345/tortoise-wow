name: Playerbot inventory consumables
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-methods:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S tests/playerbot-consumables -B build/consumables
      - run: cmake --build build/consumables --config Release
      - run: ctest --test-dir build/consumables -C Release --output-on-failure
